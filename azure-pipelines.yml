trigger: none

pool: powermanage-pool

jobs:
- job: Terraforminstall
  steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: TerraformTask@5
    displayName: Terraform init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'
      backendServiceArm: 'my_service_connection_pat'
      backendAzureRmOverrideSubscriptionID: '69ba3bc7-f967-4749-bbe8-54cb06e4a54a'
      backendAzureRmResourceGroupName: 'container_rg'
      backendAzureRmStorageAccountName: 'statefilestg12'
      backendAzureRmContainerName: 'mohitcontainer12'
      backendAzureRmKey: 'patronics_terraform.tfstate'

- job: Validate
  displayName: Terraform ka validation
  dependsOn: Terraforminstall
  steps:
  - task: TerraformTask@5
    displayName: Terraform init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'
      backendServiceArm: 'my_service_connection_pat'
      backendAzureRmOverrideSubscriptionID: '69ba3bc7-f967-4749-bbe8-54cb06e4a54a'
      backendAzureRmResourceGroupName: 'container_rg'
      backendAzureRmStorageAccountName: 'statefilestg12'
      backendAzureRmContainerName: 'mohitcontainer12'
      backendAzureRmKey: 'patronics_terraform.tfstate'
 

  - task: TerraformTask@5
    displayName: Terraform validate
    inputs:
      provider: 'azurerm'
      command: 'validate'
      workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'

- job: plan
  displayName: Terraform ka plan
  dependsOn: Validate
  steps:
  - task: TerraformTask@5
    displayName: Terraform init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'
      backendServiceArm: 'my_service_connection_pat'
      backendAzureRmOverrideSubscriptionID: '69ba3bc7-f967-4749-bbe8-54cb06e4a54a'
      backendAzureRmResourceGroupName: 'container_rg'
      backendAzureRmStorageAccountName: 'statefilestg12'
      backendAzureRmContainerName: 'mohitcontainer12'
      backendAzureRmKey: 'patronics_terraform.tfstate'

  - task: TerraformTask@5
    displayName: Terraform Plan
    inputs:
      provider: 'azurerm'
      command: 'plan'
      workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'
      environmentServiceNameAzureRM: 'my_service_connection_pat'
      environmentAzureRmOverrideSubscriptionID: '69ba3bc7-f967-4749-bbe8-54cb06e4a54a'

- job: Apply
  displayName: Terraform ka Apply
  dependsOn: plan
  steps:
  - task: TerraformTask@5
    displayName: Terraform init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'
      backendServiceArm: 'my_service_connection_pat'
      backendAzureRmOverrideSubscriptionID: '69ba3bc7-f967-4749-bbe8-54cb06e4a54a'
      backendAzureRmResourceGroupName: 'container_rg'
      backendAzureRmStorageAccountName: 'statefilestg12'
      backendAzureRmContainerName: 'mohitcontainer12'
      backendAzureRmKey: 'patronics_terraform.tfstate'


  - task: TerraformTask@5
    displayName: Terraform Apply
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'
      environmentServiceNameAzureRM: 'my_service_connection_pat'
      environmentAzureRmOverrideSubscriptionID: '69ba3bc7-f967-4749-bbe8-54cb06e4a54a'


