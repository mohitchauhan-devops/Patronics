trigger: none

pool: powermanage-pool

stages:

#=================================
# Stage - 1 Setup
#=================================

- stage: Setup
  displayName: "Terraform Install"

  jobs:
    - job: InstallTerraform

      steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'

#=================================
# Stage - 2 Validation
#=================================
- stage: Validation
  displayName: "Terraform Validation"
  dependsOn: Setup

  jobs:
    - job: validateTerraform

      steps:
      
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'

      - task: TerraformTask@5
        displayName: Terraform format check
        inputs:
          provider: 'azurerm'
          command: 'custom'
          workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'
          outputTo: 'console'
          customCommand: 'terraform fmt'
          environmentServiceNameAzureRM: 'my_service_connection_pat'
          environmentAzureRmOverrideSubscriptionID: '69ba3bc7-f967-4749-bbe8-54cb06e4a54a'

      - task: TerraformTask@5
        displayName: Terraform validate
        inputs:
          provider: 'azurerm'
          command: 'validate'
          workingDirectory: '$(System.DefaultWorkingDirectory)/todoappinfra'

