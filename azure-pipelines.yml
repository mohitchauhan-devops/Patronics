trigger: none

pool: powermanage-pool

stages:

# stage 1 - init
  - stage: init

    jobs:
    - job: tintu
      displayName: terraforminit

      steps:
        - task: PowerShell@2
          inputs:
           targetType: 'inline'
           script: |
            terraform --version
            terraform init

# stage 2 - plan
  - stage: Plan
    dependsOn: init

    jobs:
      - job: Terraformplan
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'terraform plan -out=tfplan'
